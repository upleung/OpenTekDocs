#---- 1. Site config ----

site_name: OpenTekDocs  # 改成你的文档站名称
site_url: https://upleung.github.io/OpenTekDocs/  # 你的 GitHub Pages 专属链接
site_author: McGTek
site_description: >-
  Born for documents, yet beyond documents. 
  Accessible to everyone, extremely easy to use. 
  Modern, lightweight, customizable, responsive.

repo_url: https://github.com/upleung/OpenTekDocs  # 你的代码仓库地址
repo_name: upleung/OpenTekDocs  # 右上角跳转 Github 的名称
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2016 - 2026 Aaron Wang

# Additional configuration
extra:
  status:
    new: Recently updated
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/upleung
      name: GitHub
    - icon: material/email
      link: mailto:McGTek@gmail.com
      name: Email
    - icon: fontawesome/brands/discord
      link: https://discord.com
      name: Discord


#---- 2. Theme ----

theme:
  name: materialx
  custom_dir: material/overrides
  code:
    fold:
      enabled: true
  features:
    - content.action.edit
    - content.action.view
    - content.action.agents
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.tabs.link
    - content.footnote.tooltips
    - content.tooltips

    - navigation.tabs
    # - navigation.tabs.sticky
    # - navigation.top
    # - navigation.tracking
    # - navigation.expand
    # - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.footer

    - search.highlight
    - search.share
    - search.suggest

    - toc.follow
    # - toc.integrate

  # topbar_style: primary   # glass primary accent
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  font: false
  favicon: octicons/milestone-24
  icon:
    logo: material/book-open-page-variant
  admonition:
    git:
      icon: simple/git
      color: '#f34f29'
    desc:
      icon: octicons/question-16
      color: rgba(158, 158, 158, 0.7)
    example-new:
      icon: material/format-list-group
      color: var(--md-admonition-color--example)
    copyright:
      icon: material/copyright
      color: '#2b9b9b'
    heart:
      icon: octicons/heart-24
      color: '#9b2b9b'
    lyrics:
      icon: material/microphone
      color: '#2b2b9b'
    soundcloud:
      icon: simple/soundcloud
      color: '#ff7700'

#---- 3. Plugins & Hooks ----

plugins:
  # - blog
  # - tags
  - offline
  - search
  # - minify:
  #     minify_html: true

  - document-dates:
      type: timeago
      locale: en
      exclude: ['index.md', 'license.md', '*/index.md', 'blog/*']

  - glightbox
  - drawio:
      darkmode: true

# Hooks
hooks:
  - material/overrides/hooks/shortcodes.py
  - material/overrides/hooks/translations.py


#---- 4. Extensions ----

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      toc_depth: 4
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
      # smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      # linenums: true
      # linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - docs
        - .
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      relaxed_headers: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  # - material.extensions.code_download


#---- 5. Page tree ----

# use_directory_urls: false
exclude_docs: |
  archives/
#  /drafts/

# not_in_nav: |
#   /tutorials/**/*.md
